apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels: {{- include "deployment.labels" . | nindent 4 }}
  name: {{ include "deployment.name" . }}
  namespace: {{ .Values.argocd.namespace }}
spec:
  project: {{ include "deployment.name" . }}
  source:
    repoURL: {{ .Values.bootstrapper.git.url }}
    targetRevision: {{ .Values.bootstrapper.git.commit }}
    path: {{ .Values.bootstrapper.git.path }}
    helm:
      valueFiles:
        - values.yaml
        - values-{{ .Values.bootstrapper.env }}.yaml
  destination:
    namespace: {{ .Values.argocd.namespace }}
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
