# Local Values

apps:
  - name: streamer
    git:
      commit: main
      url: https://github.com/nhojpatrick/crc-openshift-argocd.git
    helm:
      path: apps
      valueFile: values-streamer.yaml

argocd:
  namespace: openshift-gitops
  project: bootstrapper

bootstrapper:
  env: local
  git:
    commit: main
    path: bootstrapper
    url: https://github.com/nhojpatrick/crc-openshift-argocd.git

destination:
  namespace: openshift-gitops
  server: 'https://kubernetes.default.svc'
